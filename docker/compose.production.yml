name: aether

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aether}
      POSTGRES_USER: ${POSTGRES_USER:-aether}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - aether_postgres_data:/var/lib/postgresql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env.production
    environment:
      DATABASE_URL: ""
      DATABASE_HOST: postgres
      DATABASE_NAME: ${POSTGRES_DB:-aether}
      DATABASE_USER: ${POSTGRES_USER:-aether}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      AETHER_BOOTSTRAP_SECRET_FILE: /run/secrets/aether_bootstrap_secret
      UISP_API_TOKEN_FILE: /run/secrets/uisp_api_token
      AETHER_PRIVATE_STORAGE_PATH: /app/backend/private_storage
    secrets:
      - postgres_password
      - aether_bootstrap_secret
      - uisp_api_token
    volumes:
      - aether_private_storage:/app/backend/private_storage
    networks:
      - data
      - edge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      AETHER_DOMAIN: ${AETHER_DOMAIN:?Define AETHER_DOMAIN in docker/.env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  aether_bootstrap_secret:
    file: ./secrets/aether_bootstrap_secret.txt
  uisp_api_token:
    file: ./secrets/uisp_api_token.txt

volumes:
  aether_postgres_data:
  aether_private_storage:
  caddy_data:
  caddy_config:

networks:
  data:
    internal: true
  edge:
