[project]
# Mantener las dependencias reproducibles dentro de la imagen de Aether.
name = "aether-backend"
version = "0.1.0"
description = "Backend principal de Aether para Servicios AMR."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18,<1.19",
    "fastapi>=0.140,<0.141",
    "psycopg[binary]>=3.3,<3.4",
    "python-dotenv>=1.2,<1.3",
    "python-multipart>=0.0.9,<0.1",
    "python-docx>=1.2,<2",
    "pypdf>=6.0,<7",
    "reportlab>=4.0,<5",
    "sqlalchemy>=2.0.51,<2.1",
    "uvicorn[standard]>=0.51,<0.52",
    "xlsxwriter>=3.2,<4",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
